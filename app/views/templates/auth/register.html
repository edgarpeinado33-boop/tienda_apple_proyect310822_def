{% extends "base.html" %}

{% block title %}Registro - Tienda Apple{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-lg border-0 fade-in">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="fab fa-apple fa-3x text-dark"></i>
                    <h4 class="mt-2 fw-bold">Crear Cuenta</h4>
                    <p class="text-muted small">Regístrate para comenzar a comprar</p>
                </div>
                
                <form method="POST" action="{{ url_for('auth.register') }}" id="registerForm">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    
                    <div class="mb-3">
                        <label for="nombre_completo" class="form-label fw-semibold">
                            <i class="fas fa-user me-1"></i> Nombre Completo
                        </label>
                        <input type="text" class="form-control form-control-lg" id="nombre_completo" name="nombre_completo" 
                               placeholder="Juan Pérez" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">
                            <i class="fas fa-envelope me-1"></i> Email
                        </label>
                        <input type="email" class="form-control form-control-lg" id="email" name="email" 
                               placeholder="ejemplo@correo.com" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="telefono" class="form-label fw-semibold">
                            <i class="fas fa-phone me-1"></i> Teléfono (opcional)
                        </label>
                        <input type="tel" class="form-control form-control-lg" id="telefono" name="telefono" 
                               placeholder="+34 600 000 000">
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">
                            <i class="fas fa-lock me-1"></i> Contraseña
                        </label>
                        <div class="input-group">
                            <input type="password" class="form-control form-control-lg" id="password" name="password" 
                                   placeholder="Mínimo 8 caracteres" required minlength="8">
                            <button class="btn btn-outline-secondary" type="button" id="togglePassword" 
                                    style="border-radius: 0 8px 8px 0; border-left: none; padding: 0 15px; display: flex; align-items: center; justify-content: center;">
                                <svg id="eyeIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg id="eyeIconSlash" style="display: none;" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </button>
                        </div>
                        <div class="form-text small text-muted">
                            <i class="fas fa-info-circle me-1"></i> La contraseña debe tener al menos 8 caracteres
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label fw-semibold">
                            <i class="fas fa-check-circle me-1"></i> Confirmar Contraseña
                        </label>
                        <div class="input-group">
                            <input type="password" class="form-control form-control-lg" id="confirm_password" name="confirm_password" 
                                   placeholder="Repite tu contraseña" required>
                            <button class="btn btn-outline-secondary" type="button" id="toggleConfirmPassword" 
                                    style="border-radius: 0 8px 8px 0; border-left: none; padding: 0 15px; display: flex; align-items: center; justify-content: center;">
                                <svg id="eyeIconConfirm" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg id="eyeIconConfirmSlash" style="display: none;" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </button>
                        </div>
                    </div>
                    
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="terms" name="terms" required>
                        <label class="form-check-label small" for="terms">
                            Acepto los <a href="#" class="text-decoration-none">términos y condiciones</a> 
                            y la <a href="#" class="text-decoration-none">política de privacidad</a>
                        </label>
                    </div>
                    
                    <button type="submit" class="btn btn-dark btn-lg w-100">
                        <i class="fas fa-user-plus me-2"></i> Registrarse
                    </button>
                </form>
                
                <hr class="my-4">
                
                <p class="text-center mb-0">
                    ¿Ya tienes cuenta? 
                    <a href="{{ url_for('auth.login') }}" class="fw-bold text-decoration-none">
                        Inicia Sesión <i class="fas fa-arrow-right ms-1"></i>
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Toggle para contraseña principal
    const togglePassword = document.getElementById('togglePassword');
    const password = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    const eyeIconSlash = document.getElementById('eyeIconSlash');
    
    togglePassword.addEventListener('click', function() {
        if (password.type === 'password') {
            password.type = 'text';
            eyeIcon.style.display = 'none';
            eyeIconSlash.style.display = 'block';
        } else {
            password.type = 'password';
            eyeIcon.style.display = 'block';
            eyeIconSlash.style.display = 'none';
        }
    });
    
    // Toggle para confirmar contraseña
    const toggleConfirm = document.getElementById('toggleConfirmPassword');
    const confirmPassword = document.getElementById('confirm_password');
    const eyeIconConfirm = document.getElementById('eyeIconConfirm');
    const eyeIconConfirmSlash = document.getElementById('eyeIconConfirmSlash');
    
    toggleConfirm.addEventListener('click', function() {
        if (confirmPassword.type === 'password') {
            confirmPassword.type = 'text';
            eyeIconConfirm.style.display = 'none';
            eyeIconConfirmSlash.style.display = 'block';
        } else {
            confirmPassword.type = 'password';
            eyeIconConfirm.style.display = 'block';
            eyeIconConfirmSlash.style.display = 'none';
        }
    });
});
</script>

<style>
.btn-outline-secondary {
    background-color: #fff;
}
.btn-outline-secondary:hover {
    background-color: #f8f9fa;
}
.btn-outline-secondary svg {
    color: #6c757d;
    transition: color 0.2s;
}
.btn-outline-secondary:hover svg {
    color: #1d1d1f;
}
</style>
{% endblock %}
