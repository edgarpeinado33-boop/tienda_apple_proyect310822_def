{% extends "base.html" %}

{% block title %}Restablecer Contraseña - Tienda Apple{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg border-0 fade-in">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="fas fa-lock-open fa-3x text-success"></i>
                    <h4 class="mt-2 fw-bold">Restablecer Contraseña</h4>
                    <p class="text-muted small">Ingresa tu nueva contraseña</p>
                </div>
                
                <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Nueva Contraseña</label>
                        <input type="password" class="form-control form-control-lg" id="password" name="password" 
                               placeholder="Mínimo 8 caracteres" required minlength="8">
                    </div>
                    
                    <div class="mb-4">
                        <label for="confirm_password" class="form-label fw-semibold">Confirmar Nueva Contraseña</label>
                        <input type="password" class="form-control form-control-lg" id="confirm_password" name="confirm_password" 
                               placeholder="Repite tu contraseña" required>
                    </div>
                    
                    <button type="submit" class="btn btn-success btn-lg w-100">
                        <i class="fas fa-check me-2"></i> Restablecer Contraseña
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
