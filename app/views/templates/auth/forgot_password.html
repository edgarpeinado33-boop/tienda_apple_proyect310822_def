{% extends "base.html" %}

{% block title %}Recuperar Contraseña - Tienda Apple{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg border-0 fade-in">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="fas fa-key fa-3x text-primary"></i>
                    <h4 class="mt-2 fw-bold">Recuperar Contraseña</h4>
                    <p class="text-muted small">Te enviaremos un enlace para restablecer tu contraseña</p>
                </div>
                
                <form method="POST" action="{{ url_for('auth.forgot_password') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    
                    <div class="mb-4">
                        <label for="email" class="form-label fw-semibold">Email</label>
                        <input type="email" class="form-control form-control-lg" id="email" name="email" 
                               placeholder="ejemplo@correo.com" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-lg w-100">
                        <i class="fas fa-paper-plane me-2"></i> Enviar Enlace de Recuperación
                    </button>
                </form>
                
                <hr class="my-4">
                
                <p class="text-center mb-0">
                    <a href="{{ url_for('auth.login') }}" class="text-decoration-none">
                        <i class="fas fa-arrow-left me-1"></i> Volver al inicio de sesión
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
