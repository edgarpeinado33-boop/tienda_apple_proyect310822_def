{% extends "base.html" %}

{% block title %}Iniciar Sesión - Tienda Apple{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg border-0 fade-in">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="fab fa-apple fa-3x text-dark"></i>
                    <h4 class="mt-2 fw-bold">Iniciar Sesión</h4>
                    <p class="text-muted small">Accede a tu cuenta para comprar productos Apple</p>
                </div>
                
                <form method="POST" action="{{ url_for('auth.login') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">
                            <i class="fas fa-envelope me-1"></i> Email
                        </label>
                        <input type="email" class="form-control form-control-lg" id="email" name="email" 
                               placeholder="ejemplo@correo.com" required autofocus>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">
                            <i class="fas fa-lock me-1"></i> Contraseña
                        </label>
                        <div class="input-group">
                            <input type="password" class="form-control form-control-lg" id="password" name="password" 
                                   placeholder="Ingresa tu contraseña" required>
                            <button class="btn btn-outline-secondary" type="button" id="togglePassword" 
                                    style="border-radius: 0 8px 8px 0; border-left: none; padding: 0 15px; display: flex; align-items: center; justify-content: center;">
                                <!-- SVG del ojo (visible por defecto) -->
                                <svg id="eyeIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <!-- SVG del ojo tachado (oculto) -->
                                <svg id="eyeIconSlash" style="display: none;" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </button>
                        </div>
                    </div>
                    
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="remember" name="remember">
                            <label class="form-check-label small" for="remember">Recordarme</label>
                        </div>
                        <a href="{{ url_for('auth.forgot_password') }}" class="small text-decoration-none">
                            ¿Olvidaste tu contraseña?
                        </a>
                    </div>
                    
                    <button type="submit" class="btn btn-dark btn-lg w-100">
                        <i class="fas fa-sign-in-alt me-2"></i> Iniciar Sesión
                    </button>
                </form>
                
                <hr class="my-4">
                
                <p class="text-center mb-0">
                    ¿No tienes cuenta? 
                    <a href="{{ url_for('auth.register') }}" class="fw-bold text-decoration-none">
                        Regístrate aquí <i class="fas fa-arrow-right ms-1"></i>
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const togglePassword = document.getElementById('togglePassword');
    const password = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    const eyeIconSlash = document.getElementById('eyeIconSlash');
    
    togglePassword.addEventListener('click', function() {
        if (password.type === 'password') {
            password.type = 'text';
            eyeIcon.style.display = 'none';
            eyeIconSlash.style.display = 'block';
        } else {
            password.type = 'password';
            eyeIcon.style.display = 'block';
            eyeIconSlash.style.display = 'none';
        }
    });
});
</script>

<style>
.btn-outline-secondary {
    background-color: #fff;
}
.btn-outline-secondary:hover {
    background-color: #f8f9fa;
}
.btn-outline-secondary svg {
    color: #6c757d;
    transition: color 0.2s;
}
.btn-outline-secondary:hover svg {
    color: #1d1d1f;
}
</style>
{% endblock %}
