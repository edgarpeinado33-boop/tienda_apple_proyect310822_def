{% extends "base.html" %}

{% block title %}Crear Producto - Administración{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3"><i class="fas fa-plus-circle me-2"></i> Nuevo Producto</h1>
    <a href="{{ url_for('admin.gestion_productos') }}" class="btn btn-outline-secondary">
        <i class="fas fa-arrow-left me-2"></i> Volver
    </a>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="POST" action="{{ url_for('admin.crear_producto') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre del Producto *</label>
                        <input type="text" class="form-control" name="nombre" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Precio Base *</label>
                        <input type="number" class="form-control" name="precio_base" step="0.01" min="0" required>
                    </div>
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label fw-semibold">Descripción</label>
                <textarea class="form-control" name="descripcion" rows="3"></textarea>
            </div>
            
            <div class="row">
                <div class="col-md-4">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Familia</label>
                        <input type="text" class="form-control" name="familia" placeholder="iPhone, MacBook, ...">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Marca</label>
                        <input type="text" class="form-control" name="marca" value="Apple">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Estado</label>
                        <select class="form-select" name="estado">
                            <option value="activo">Activo</option>
                            <option value="inactivo">Inactivo</option>
                            <option value="proximo">Próximo</option>
                            <option value="discontinuado">Discontinuado</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">URL de Imagen</label>
                        <input type="url" class="form-control" name="imagen_url" 
                               placeholder="https://ejemplo.com/imagen.jpg">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Código de Fabricante</label>
                        <input type="text" class="form-control" name="codigo_fabricante">
                    </div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Peso (kg)</label>
                        <input type="number" class="form-control" name="peso_kg" step="0.001">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Dimensiones</label>
                        <input type="text" class="form-control" name="dimensiones" 
                               placeholder="10x5x2 cm">
                    </div>
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label fw-semibold">Categorías</label>
                <select class="form-select" name="categorias" multiple size="4">
                    {% for cat in categorias %}
                    <option value="{{ cat.id_categoria }}">{{ cat.nombre }}</option>
                    {% endfor %}
                </select>
                <small class="text-muted">Mantén presionado Ctrl para seleccionar múltiples</small>
            </div>
            
            <hr>
            <h5 class="mb-3"><i class="fas fa-cubes me-2"></i> Variantes del Producto</h5>
            
            <div id="variantes-container">
                <div class="row g-2 mb-2">
                    <div class="col-3">
                        <input type="text" class="form-control form-control-sm" name="colores[]" placeholder="Color">
                    </div>
                    <div class="col-3">
                        <input type="text" class="form-control form-control-sm" name="capacidades[]" placeholder="Capacidad">
                    </div>
                    <div class="col-2">
                        <input type="number" class="form-control form-control-sm" name="precios_extra[]" 
                               placeholder="Precio extra" step="0.01">
                    </div>
                    <div class="col-2">
                        <input type="number" class="form-control form-control-sm" name="stocks[]" 
                               placeholder="Stock" min="0">
                    </div>
                    <div class="col-2">
                        <input type="text" class="form-control form-control-sm" name="skus[]" placeholder="SKU *">
                    </div>
                </div>
            </div>
            
            <button type="button" class="btn btn-sm btn-outline-primary" id="addVariante">
                <i class="fas fa-plus me-1"></i> Agregar Variante
            </button>
            
            <hr>
            
            <button type="submit" class="btn btn-dark">
                <i class="fas fa-save me-2"></i> Crear Producto
            </button>
        </form>
    </div>
</div>

<script>
document.getElementById('addVariante').addEventListener('click', function() {
    const container = document.getElementById('variantes-container');
    const row = document.createElement('div');
    row.className = 'row g-2 mb-2 fade-in';
    row.innerHTML = `
        <div class="col-3">
            <input type="text" class="form-control form-control-sm" name="colores[]" placeholder="Color">
        </div>
        <div class="col-3">
            <input type="text" class="form-control form-control-sm" name="capacidades[]" placeholder="Capacidad">
        </div>
        <div class="col-2">
            <input type="number" class="form-control form-control-sm" name="precios_extra[]" 
                   placeholder="Precio extra" step="0.01">
        </div>
        <div class="col-2">
            <input type="number" class="form-control form-control-sm" name="stocks[]" 
                   placeholder="Stock" min="0">
        </div>
        <div class="col-1">
            <input type="text" class="form-control form-control-sm" name="skus[]" placeholder="SKU *">
        </div>
        <div class="col-1">
            <button type="button" class="btn btn-sm btn-danger remove-variante">
                <i class="fas fa-times"></i>
            </button>
        </div>
    `;
    container.appendChild(row);
    
    // Agregar evento para eliminar
    row.querySelector('.remove-variante').addEventListener('click', function() {
        row.remove();
    });
});
</script>
{% endblock %}
