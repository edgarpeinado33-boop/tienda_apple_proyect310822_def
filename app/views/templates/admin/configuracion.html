{% extends "base.html" %}

{% block title %}Configuración - Administración{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3">
        <i class="fas fa-cog me-2"></i> Configuración del Sistema
    </h1>
    <a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline-secondary">
        <i class="fas fa-arrow-left me-2"></i> Volver al Dashboard
    </a>
</div>

<div class="card shadow-sm border-0">
    <div class="card-header bg-transparent">
        <h5 class="mb-0">Configuración General</h5>
    </div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('admin.guardar_configuracion') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre de la Tienda</label>
                        <input type="text" class="form-control" name="nombre_tienda" 
                               value="{{ config.nombre_tienda or 'Tienda Apple' }}">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email de Contacto</label>
                        <input type="email" class="form-control" name="email_contacto" 
                               value="{{ config.email_contacto or 'contacto@tiendaapple.com' }}">
                    </div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Teléfono de Contacto</label>
                        <input type="text" class="form-control" name="telefono_contacto" 
                               value="{{ config.telefono_contacto or '+34 900 123 456' }}">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Dirección</label>
                        <input type="text" class="form-control" name="direccion_tienda" 
                               value="{{ config.direccion_tienda or 'Calle Principal 1, Madrid' }}">
                    </div>
                </div>
            </div>
            
            <hr>
            
            <div class="row">
                <div class="col-md-4">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">IVA (%)</label>
                        <input type="number" class="form-control" name="iva_porcentaje" step="0.01" 
                               value="{{ config.iva_porcentaje or 21 }}">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Gastos de Envío (€)</label>
                        <input type="number" class="form-control" name="gastos_envio_estandar" step="0.01" 
                               value="{{ config.gastos_envio_estandar or 5.99 }}">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Envío Gratis desde (€)</label>
                        <input type="number" class="form-control" name="gastos_envio_gratis_desde" step="0.01" 
                               value="{{ config.gastos_envio_gratis_desde or 50 }}">
                    </div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email de Notificaciones</label>
                        <input type="email" class="form-control" name="email_notificaciones" 
                               value="{{ config.email_notificaciones or 'notificaciones@tiendaapple.com' }}">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Moneda</label>
                        <select class="form-select" name="moneda">
                            <option value="EUR" {% if config.moneda == 'EUR' %}selected{% endif %}>EUR (€)</option>
                            <option value="USD" {% if config.moneda == 'USD' %}selected{% endif %}>USD ($)</option>
                            <option value="GBP" {% if config.moneda == 'GBP' %}selected{% endif %}>GBP (£)</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Idioma</label>
                        <select class="form-select" name="idioma">
                            <option value="es" {% if config.idioma == 'es' %}selected{% endif %}>Español</option>
                            <option value="en" {% if config.idioma == 'en' %}selected{% endif %}>English</option>
                            <option value="fr" {% if config.idioma == 'fr' %}selected{% endif %}>Français</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <hr>
            
            <button type="submit" class="btn btn-dark">
                <i class="fas fa-save me-2"></i> Guardar Configuración
            </button>
        </form>
    </div>
</div>
{% endblock %}
